services:
  db:
    image: postgres:16-alpine
    container_name: busonotec-postgres
    environment:
      POSTGRES_DB: "busonotec-db"
      POSTGRES_USER: "busonotec-user"
      POSTGRES_PASSWORD: "busonotec-pass"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
