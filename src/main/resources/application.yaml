spring:
  application:
    name: busonotec-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/busonotec-db}
    username: ${SPRING_DATASOURCE_USERNAME:busonotec-user}
    password: ${SPRING_DATASOURCE_PASSWORD:busonotec-pass}
    driver-class-name: org.postgresql.Driver

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
